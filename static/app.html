<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>محمد مهدی احمدی · VPN</title>
<link rel="icon" href="/static/spider-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#07120e;--bg2:#0c1a14;--card:#0f1f18;--border:#1a3328;--text:#e6f5ee;--muted:#7a9a8a;
  --accent:#14b8a6;--accent2:#2dd4bf;--accent3:#5eead4;
  --success:#4ade80;--danger:#fb7185;--warn:#fbbf24;
  --radius:18px;--radius-lg:26px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:Vazirmatn,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(20,184,166,.14),transparent 60%)}
.container{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.brand{text-align:center;padding:20px 0 6px}
.brand img{width:56px;height:56px;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 4px 18px rgba(20,184,166,.35))}
.brand h1{font-size:23px;font-weight:900;letter-spacing:.3px;background:linear-gradient(100deg,#14b8a6,#2dd4bf 45%,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{font-size:12px;color:var(--muted);margin-top:5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 20px;margin-top:16px;box-shadow:0 12px 40px -14px rgba(0,0,0,.55)}
.card h2{font-size:13.5px;font-weight:800;margin-bottom:15px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--border);background:rgba(0,0,0,.35);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:all .2s;direction:ltr;text-align:left}
.field input.fa{direction:rtl;text-align:right}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(20,184,166,.15)}
.btn{width:100%;padding:15px;border:none;border-radius:16px;background:linear-gradient(100deg,#14b8a6,#0d9488);color:#06281a;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;box-shadow:0 6px 24px -6px rgba(20,184,166,.45)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-ghost{background:rgba(20,184,166,.08);color:var(--accent2);box-shadow:none;border:1px solid rgba(20,184,166,.22)}
.btn-sm{width:auto;padding:9px 15px;font-size:12px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;flex:1;justify-content:center}
.err{display:none;background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.3);color:var(--danger);border-radius:14px;padding:11px 14px;font-size:12.5px;margin-bottom:14px;text-align:center}
.err.show{display:block}
.status-name{font-size:17px;font-weight:900;text-align:center}
.status-sub{font-size:11.5px;color:var(--muted);margin-top:4px;text-align:center}
.status-pill{display:block;width:fit-content;margin:12px auto 0;padding:5px 18px;border-radius:30px;font-size:11.5px;font-weight:800;text-align:center}
.status-pill.active{background:rgba(74,222,128,.12);color:var(--success);border:1px solid rgba(74,222,128,.3)}
.status-pill.inactive{background:rgba(251,113,133,.12);color:var(--danger);border:1px solid rgba(251,113,133,.3)}
.status-pill.warn{background:rgba(251,191,36,.12);color:var(--warn);border:1px solid rgba(251,191,36,.3)}
.toggle-wrap{display:flex;flex-direction:column;align-items:center;padding:22px 0 6px}
.toggle-label{font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:700}
.switch{width:150px;height:74px;border-radius:40px;background:#0a1512;border:2px solid var(--border);position:relative;cursor:pointer;transition:all .35s;overflow:hidden;user-select:none}
.switch .knob{position:absolute;top:5px;right:5px;width:60px;height:60px;border-radius:50%;background:#2a3b33;transition:all .35s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;justify-content:center;font-size:24px;color:#7a9a8a}
.switch.on{background:rgba(20,184,166,.2);border-color:var(--accent);box-shadow:0 0 40px rgba(20,184,166,.3)}
.switch.on .knob{right:81px;background:linear-gradient(135deg,#14b8a6,#2dd4bf);box-shadow:0 4px 20px rgba(20,184,166,.6);color:#06281a}
.switch.connecting{opacity:.55;pointer-events:none}
.toggle-hint{font-size:11.5px;color:var(--muted);margin-top:13px;line-height:1.9;text-align:center;max-width:430px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.stat{background:rgba(20,184,166,.05);border:1px solid var(--border);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:14px;font-weight:800;color:var(--accent2);direction:ltr}
.stat span{font-size:10px;color:var(--muted);font-weight:600;margin-top:3px;display:block}
.cfg{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:10px}
.cfg-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cfg-name{font-size:12.5px;font-weight:800}
.cfg-loc{font-size:10px;color:var(--muted)}
.cfg-code{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-family:Consolas,monospace;font-size:9.5px;color:var(--accent3);word-break:break-all;line-height:1.7;max-height:60px;overflow-y:auto;direction:ltr;text-align:left}
.cfg-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.copy-btn{background:rgba(20,184,166,.12);color:var(--accent2);border:1px solid rgba(20,184,166,.25)}
.import-btn{background:rgba(94,234,212,.1);color:var(--accent3);border:1px solid rgba(94,234,212,.25)}
.qr-btn{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--border)}
.center-row{display:flex;gap:8px;margin-top:14px;justify-content:center}
.center-row .btn-sm{flex:0 1 auto}
#qrModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
#qrModal.open{display:flex}
.qr-box{background:#fff;border-radius:20px;padding:20px;text-align:center;max-width:320px;width:100%}
.qr-box img{width:220px;height:220px;border-radius:12px;background:#fff}
.qr-box .qr-name{font-size:13px;font-weight:800;color:#111;margin-bottom:10px;word-break:break-all;direction:ltr}
.qr-close{margin-top:14px;width:100%;padding:11px;border:none;border-radius:12px;background:#111;color:#fff;font-family:inherit;font-weight:700;cursor:pointer}
.foot{text-align:center;padding:26px 0 10px;font-size:10.5px;color:var(--muted)}
.foot button{background:none;border:none;color:var(--accent2);font-family:inherit;font-size:11px;cursor:pointer;text-decoration:underline}
.hidden{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:#0f1f18;border:1px solid var(--border);color:var(--text);border-radius:14px;padding:11px 20px;font-size:12.5px;opacity:0;transition:all .3s;z-index:999;box-shadow:0 8px 30px rgba(0,0,0,.5);white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(74,222,128,.4);color:var(--success)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(6,40,26,.25);border-top-color:#06281a;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <img src="/static/spider-logo.svg" alt="محمد مهدی احمدی">
    <h1>محمد مهدی احمدی</h1>
    <p>برنامه VPN — اتصال امن و سریع</p>
  </div>

  <!-- Screen 1: connect -->
  <div id="screen-login">
    <div class="card">
      <h2><span class="dot"></span> ورود با کد اشتراک</h2>
      <div class="err" id="login-err"></div>
      <div class="field">
        <label>آدرس پنل</label>
        <input id="in-panel" type="url" placeholder="https://your-panel.com" autocomplete="off">
      </div>
      <div class="field">
        <label>کد شما (نام کاربری یا کد اشتراک)</label>
        <input id="in-code" class="fa" placeholder="کد خود را وارد کنید" autocomplete="off">
      </div>
      <button class="btn" id="btn-login" onclick="doLogin()">اتصال به پنل</button>
      <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:13px;line-height:1.9">کد را از فروشنده دریافت کرده‌اید.<br>اگر پنل جدیدی ساخته شود، همین برنامه بدون هیچ تغییری کار می‌کند.</p>
    </div>
  </div>

  <!-- Screen 2: dashboard -->
  <div id="screen-dash" class="hidden">
    <div class="card">
      <div class="status-name" id="dash-name">—</div>
      <div class="status-sub" id="dash-sub">—</div>
      <span class="status-pill" id="dash-pill">—</span>
      <div class="toggle-wrap">
        <div class="toggle-label" id="toggle-label">VPN خاموش است</div>
        <div class="switch" id="vpn-switch" onclick="toggleVpn()">
          <div class="knob" id="vpn-knob">⏻</div>
        </div>
        <div class="toggle-hint" id="toggle-hint">برای اتصال دکمه را روشن کنید.</div>
      </div>
      <div class="stats">
        <div class="stat"><b id="st-used">0</b><span>مصرف شده</span></div>
        <div class="stat"><b id="st-limit">∞</b><span>محدودیت</span></div>
        <div class="stat"><b id="st-exp">—</b><span>روز باقی‌مانده</span></div>
      </div>
    </div>

    <div class="card">
      <h2><span class="dot"></span> کانفیگ‌های شما</h2>
      <div id="cfg-list"></div>
      <div class="center-row">
        <button class="btn btn-ghost btn-sm" onclick="loadData(true)">↻ بروزرسانی</button>
        <button class="btn btn-ghost btn-sm" onclick="copySubUrl()">کپی لینک اشتراک</button>
      </div>
    </div>
    <div class="foot">محمد مهدی احمدی · VPN<br><button onclick="logout()">خروج و تغییر کد</button></div>
  </div>
</div>

<div id="qrModal">
  <div class="qr-box">
    <div class="qr-name" id="qrName"></div>
    <img id="qrImg" alt="QR">
    <button class="qr-close" onclick="closeQr()">بستن</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var state = { panel:'', code:'', data:null, vpnOn:false, timer:null };
(function(){
  var p = document.getElementById('in-panel');
  p.value = location.origin;
  try {
    var savedState = localStorage.getItem('app-session');
    if (savedState) {
      var s = JSON.parse(savedState);
      if (s.panel && s.code) {
        p.value = s.panel;
        document.getElementById('in-code').value = s.code;
        state.panel = s.panel; state.code = s.code;
        doLogin();
      }
    }
  } catch(e){}
})();
function toast(m, ok){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast show'+(ok?' ok':''); setTimeout(function(){t.classList.remove('show')},2400); }
function setErr(id,msg){ var e=document.getElementById(id); if(msg){e.textContent=msg;e.classList.add('show');} else { e.classList.remove('show'); } }
function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
function fmtB(b){ b=Number(b)||0; if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(1)+' KB'; if(b<1073741824)return (b/1048576).toFixed(2)+' MB'; return (b/1073741824).toFixed(2)+' GB'; }
function toFa(n){ return String(n).replace(/\d/g,function(d){return'۰۱۲۳۴۵۶۷۸۹'[d]}); }
function normalizePanel(u){
  u = String(u||'').trim().replace(/\/+$/,'');
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
async function apiGet(path){
  var base = normalizePanel(state.panel);
  var r = await fetch(base + path, { headers:{'Accept':'application/json'} });
  if (r.status === 404) throw new Error('پنل یا کد پیدا نشد');
  if (!r.ok) throw new Error('خطای سرور: ' + r.status);
  return r.json();
}
async function doLogin(){
  var panel = normalizePanel(document.getElementById('in-panel').value);
  var code = document.getElementById('in-code').value.trim();
  if (!panel || !code){ setErr('login-err','آدرس پنل و کد را وارد کنید'); return; }
  state.panel = panel; state.code = code;
  setErr('login-err','');
  var btn = document.getElementById('btn-login');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> در حال اتصال...';
  try {
    var looksUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(code);
    var data = null;
    if (looksUuid) {
      try { data = await apiGet('/api/link/' + encodeURIComponent(code)); }
      catch(e){ data = await apiGet('/api/sub/' + encodeURIComponent(code)); }
    } else {
      data = await apiGet('/api/sub/' + encodeURIComponent(code));
    }
    state.data = data;
    try { localStorage.setItem('app-session', JSON.stringify({panel:panel, code:code})); } catch(e){}
    showDash();
  } catch(ex) {
    setErr('login-err', ex.message || 'خطا در اتصال');
  } finally {
    btn.disabled = false; btn.innerHTML = 'اتصال به پنل';
  }
}
function showDash(){
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('screen-dash').classList.remove('hidden');
  render();
  if (state.timer) clearInterval(state.timer);
  state.timer = setInterval(function(){ loadData(true); }, 20000);
}
function logout(){
  if (state.timer) clearInterval(state.timer);
  try { localStorage.removeItem('app-session'); } catch(e){}
  location.reload();
}
function render(){
  var d = state.data || {};
  document.getElementById('dash-name').textContent = d.username || state.code;
  var sub = [];
  sub.push('وضعیت: ' + (d.status === 'active' ? 'فعال' : (d.status === 'expired' ? 'منقضی شده' : (d.status === 'disabled' ? 'غیرفعال' : (d.status || '—')))));
  if (d.expire_at_ts) sub.push('انقضا: ' + new Date(d.expire_at_ts*1000).toLocaleDateString('fa-IR'));
  document.getElementById('dash-sub').textContent = sub.join(' • ');
  var pill = document.getElementById('dash-pill');
  if (d.status === 'active' && d.is_active !== false) { pill.className='status-pill active'; pill.textContent='✓ فعال'; }
  else if (d.status === 'expired') { pill.className='status-pill inactive'; pill.textContent='✕ منقضی'; }
  else { pill.className='status-pill warn'; pill.textContent='! غیرفعال'; }
  document.getElementById('st-used').textContent = fmtB(d.traffic_used_bytes);
  document.getElementById('st-limit').textContent = (d.traffic_limit_bytes && d.traffic_limit_bytes>0) ? fmtB(d.traffic_limit_bytes) : '∞';
  document.getElementById('st-exp').textContent = (d.expire_days !== null && d.expire_days !== undefined) ? toFa(d.expire_days) : '—';
  var list = document.getElementById('cfg-list');
  var cfgs = Array.isArray(d.configs) ? d.configs : [];
  if (!cfgs.length && d.vless_link) cfgs = [d.vless_link];
  if (!cfgs.length) { list.innerHTML = '<p style="text-align:center;color:var(--muted);font-size:12px">کانفیگی موجود نیست</p>'; return; }
  list.innerHTML = cfgs.map(function(c,i){
    var label = 'کانفیگ ' + toFa(i+1);
    var loc = (d.worker_countries && d.worker_countries[i]) || '';
    return '<div class="cfg"><div class="cfg-head"><div class="cfg-name">'+esc(label)+'</div>'+(loc?'<div class="cfg-loc">'+esc(loc)+'</div>':'')+'</div>'+
      '<div class="cfg-code">'+esc(c)+'</div>'+
      '<div class="cfg-actions">'+
        '<button class="btn-sm copy-btn" onclick="copyCfg('+i+')">کپی</button>'+
        '<button class="btn-sm import-btn" onclick="importCfg('+i+')">اتصال</button>'+
        '<button class="btn-sm qr-btn" onclick="showQr('+i+')">QR</button>'+
      '</div></div>';
  }).join('');
}
function copyCfg(i){
  var cfgs = state.data && state.data.configs ? state.data.configs : [];
  var c = cfgs[i] || (state.data && state.data.vless_link);
  if (!c) return;
  doCopy(c).then(function(){ toast('کپی شد ✓','ok'); }).catch(function(){ toast('کپی ناموفق'); });
}
function doCopy(text){
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise(function(res, rej){
    var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); res(); }catch(e){ rej(e); } finally { document.body.removeChild(ta); }
  });
}
function showQr(i){
  var cfgs = state.data && state.data.configs ? state.data.configs : [];
  var c = cfgs[i] || (state.data && state.data.vless_link);
  if (!c) return;
  document.getElementById('qrName').textContent = c;
  document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(c);
  document.getElementById('qrModal').classList.add('open');
}
function closeQr(){ document.getElementById('qrModal').classList.remove('open'); }
function subUrl(){
  if (state.data && state.data.subscription_url) return state.data.subscription_url;
  return normalizePanel(state.panel) + '/sub/' + encodeURIComponent(state.code);
}
function copySubUrl(){
  var u = subUrl();
  doCopy(u).then(function(){ toast('لینک اشتراک کپی شد ✓','ok'); }).catch(function(){ toast('کپی ناموفق'); });
}
function importCfg(i){
  var cfgs = state.data && state.data.configs ? state.data.configs : [];
  var c = cfgs[i] || (state.data && state.data.vless_link);
  var u = subUrl();
  var name = (state.data && state.data.username) || 'VPN';
  // One-tap import into an installed V2Box client; fall back to copying the link.
  var deep = 'v2box://install-sub?url=' + encodeURIComponent(u) + '&name=' + encodeURIComponent(name);
  var ok = false;
  try { window.location.href = deep; ok = true; } catch(e){}
  if (!ok && c) doCopy(c);
  toast('در حال باز کردن کلاینت VPN...');
}
function toggleVpn(){
  var sw = document.getElementById('vpn-switch');
  if (sw.classList.contains('connecting')) return;
  var on = !state.vpnOn;
  sw.classList.add('connecting');
  setTimeout(function(){
    state.vpnOn = on;
    sw.classList.remove('connecting');
    sw.classList.toggle('on', on);
    document.getElementById('toggle-label').textContent = on ? 'VPN روشن است' : 'VPN خاموش است';
    document.getElementById('toggle-hint').innerHTML = on
      ? 'برنامه VPN باز می‌شود و اتصال برقرار می‌شود. برای قطع، همین دکمه را خاموش کنید یا از داخل کلاینت خارج شوید.'
      : 'برای اتصال دکمه را روشن کنید. اگر کلاینت VPN (V2Box) نصب نیست، از دکمه «اتصال» کانفیگ را وارد کنید.';
    if (on) { importCfg(0); toast('در حال اتصال به VPN...','ok'); }
    else { toast('VPN خاموش شد'); }
  }, 350);
}
async function loadData(silent){
  if (!state.panel || !state.code) return;
  try {
    var data = await apiGet('/api/link/' + encodeURIComponent(state.code));
    state.data = data;
    if (!document.getElementById('screen-dash').classList.contains('hidden')) render();
  } catch(e) {
    if (!silent) toast('خطا در بروزرسانی وضعیت');
  }
}
document.getElementById('qrModal').addEventListener('click', function(e){ if(e.target.id==='qrModal') closeQr(); });
['in-code','in-panel'].forEach(function(id){
  document.getElementById(id).addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
});
</script>
</body>
</html>
